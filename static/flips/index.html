<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecticut flipped seats, 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2A2438; --blue: #2B6BE0; --red: #E23B3B; --gold: #FFC93C; --cream: #FFF4D6; }
  html, body { margin: 0; background: #14122b; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 48px; }
  h1, h2, .num, .wall b { font-family: 'Luckiest Guy', 'Comic Sans MS', 'Arial Black', sans-serif; font-weight: 400; letter-spacing: .5px; }
  h1 { font-size: clamp(34px, 7vw, 60px); line-height: 1.05; margin: 0 0 6px; color: var(--gold); text-wrap: balance; }
  .lede { margin: 0 0 30px; color: #cfcbe8; max-width: 60ch; }
  section { background: var(--cream); color: var(--ink); border: 5px solid var(--ink); border-radius: 26px; padding: 20px; margin-bottom: 26px; }
  h2 { font-size: clamp(26px, 5vw, 38px); margin: 0; line-height: 1.1; }
  .tally { margin: 2px 0 16px; font-weight: 600; }
  .tally .d { color: var(--blue); } .tally .r { color: var(--red); }
  a { color: inherit; text-decoration: none; }
  .wall { display: flex; align-items: center; gap: 16px; background: var(--gold); border: 4px solid var(--ink); border-radius: 18px;
          padding: 14px 18px; margin-bottom: 16px; transition: transform .12s; }
  .wall b { font-size: clamp(20px, 4vw, 28px); display: block; line-height: 1.15; }
  .wall span { font-size: 14px; }
  .mini { display: grid; grid-template-columns: repeat(6, 9px); gap: 3px; flex: none; }
  .mini i { width: 9px; height: 8px; border-radius: 2px; background: var(--blue); }
  .mini i.r { background: var(--red); } .mini i.f { background: var(--blue); outline: 2px solid var(--ink); }
  .seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px 10px; text-align: center;
          background: #fff; border: 4px solid var(--ink); border-radius: 16px; transition: transform .12s; }
  .num { width: 74px; height: 86px; display: grid; place-items: center; font-size: 34px; color: #fff; background: var(--blue);
         border: 4px solid var(--ink); border-radius: 12px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; padding-top: 4px; box-sizing: border-box; }
  .num.r { background: var(--red); }
  .name { font-weight: 700; font-size: 15px; line-height: 1.2; overflow-wrap: anywhere; }
  .note { font-size: 12px; color: #7a5a00; background: #FFE9A8; border-radius: 999px; padding: 1px 8px; }
  .wall:hover, .seat:hover, .wall:focus-visible, .seat:focus-visible { transform: translateY(-3px) rotate(-1deg); }
  a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .wall, .seat { transition: none; } .wall:hover, .seat:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Connecticut flipped seats, 2026</h1>
  <p class="lede">Short celebration videos for every General Assembly seat that changed hands. Pick a chamber overview or a single district; each page plays the animation and lets you download or post the video.</p>
  <div id="chambers"></div>
</main>
<script src="data.js"></script>
<script>
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let html = '';
for (const [key, ch] of Object.entries(CHAMBERS)) {
  if (!ch) continue;
  const fl = flipList(ch), c = seatCounts(ch);
  let mini = '';
  for (let n = 1; n <= Math.min(ch.total, 36); n++)
    mini += `<i class="${ch.flips[n] ? 'f' : seatBefore(ch, n) === 'R' ? 'r' : ''}"></i>`;
  html += `<section>
    <h2>Connecticut ${esc(ch.name)}</h2>
    <p class="tally">${fl.length} seat${fl.length === 1 ? '' : 's'} flipped:
      <span class="d">${c.dBefore} D</span>, <span class="r">${c.rBefore} R</span> before;
      <span class="d">${c.dAfter} D</span>, <span class="r">${c.rAfter} R</span> after (unofficial)</p>
    <a class="wall" href="wall.html?c=${key}">
      <span class="mini" aria-hidden="true">${mini}</span>
      <span><b>All ${ch.total} ${esc(ch.name)} seats</b><span>Every seat on one wall, with the ${fl.length} flips one after another</span></span>
    </a>
    <div class="seats">${fl.map(n => { const f = ch.flips[n]; return `
      <a class="seat" href="seat.html?c=${key}&d=${n}">
        <span class="num${f.to === 'R' ? ' r' : ''}">${n}</span>
        <span class="name">${esc(f.name)}</span>
        ${f.pending ? '<span class="note">result pending</span>' : ''}
      </a>`; }).join('')}</div>
  </section>`;
}
document.getElementById('chambers').innerHTML = html;
</script>
</body>
</html>
