<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat flipped</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=block" rel="stylesheet">
<link href="common.css" rel="stylesheet">
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
// One flipped district: seat.html?c=house&d=55
const q = new URLSearchParams(location.search);
const KEY = q.get('c') || 'house', CHM = CHAMBERS[KEY];
const N = CHM ? +(q.get('d') || flipList(CHM)[0]) : 0;
if (!CHM || !CHM.flips[N]) {
  document.body.innerHTML = `<p class="msg">No flipped seat found for chamber "${esc(KEY)}", district ${N}.</p>`;
  throw new Error('no such flipped seat');
}
const WIN = CHM.flips[N], WINP = WIN.to;
document.title = `${CHM.name} District ${N}: flipped`;
const before = n => seatBefore(CHM, n), after = n => seatAfter(CHM, n);
const flipped = n => before(n) !== after(n);

const SP = 216, CW = 170, CH = 230, BELT_Y = 720, MOVE = 0.55;

// ---------- timeline ----------
// Three seats set the pattern, then the featured one. A neighbour that also flipped does a quick flip of its own.
const SEQ = [N - 3, N - 2, N - 1, N].filter(n => n >= 1 && n <= CHM.total);
const T = {};
{
  let t = 0.6;
  for (const s of SEQ) {
    const e = T[s] = {}, main = s === N;
    e.dt = main ? 0.085 : 0.06;
    e.tally = t;
    t += 13 * e.dt + 0.2;
    e.stamp = t; e.hit = t + 0.12;
    t += 0.4;
    if (!main) {
      if (flipped(s)) { e.crouch = e.hit + 0.4; e.leap = e.crouch + 0.22; e.land = e.leap + 0.6; t = e.land + 0.5; }
      else t += 0.3;
      e.move = t; t += MOVE + 0.1;
    }
  }
}
const MOVERS = SEQ.slice(0, -1);
const F = {};                       // the featured card's flip
F.alarm = T[N].hit + 0.15;
F.crouch = T[N].hit + 0.85;
F.leap = F.crouch + 0.3;
F.land = F.leap + 0.8;
const Z = {};                       // the whole scene's flip
Z.zoom = F.land + 2.3;
Z.crouch = Z.zoom + 0.55;
Z.leap = Z.crouch + 0.35;
Z.land = Z.leap + 0.9;
const DURATION = Z.land + 6;

function beltPos(t) {
  let p = SEQ[0];
  for (const s of MOVERS) p += easeInOut(prog(t, T[s].move, MOVE));
  return p;
}
function beltLean(t) {
  for (const s of MOVERS) {
    const p = prog(t, T[s].move, MOVE);
    if (p > 0 && p < 1) return 4 * Math.sin(2 * Math.PI * p);
  }
  return 0;
}

// ---------- celebration ----------
const P = {
  pops: [
    ...MOVERS.filter(flipped).map(s => [T[s].land, 540, 600, 230, GOLD]),
    [F.land, 540, 600, 340, GOLD], [F.land + 0.35, 220, 300, 190, GOLD], [F.land + 0.6, 860, 250, 210, LBLUE],
    [F.land + 0.95, 250, 800, 170, '#3DD6C4'], [F.land + 1.25, 840, 790, 190, GOLD], [F.land + 1.6, 540, 190, 200, '#fff'],
    [F.land + 1.95, 150, 540, 160, LBLUE],
    ...finalePops(Z.land),
  ],
  bursts: [...makeBurst(11, 120, F.land, 540, 600, 450, 1500), ...makeBurst(23, 170, Z.land, 540, 620, 600, 1900)],
  balloons: [...makeBalloons(42, 10, F.land + 0.2, 1.0, false), ...makeBalloons(43, 10, Z.land + 0.1, 4.0, true)],
  rain: makeRain(5, 60), rainStart: Z.land + 0.6,
};

// ---------- static scene ----------
function frontHTML() {
  let wall = `<rect width="1080" height="1080" fill="${CREAM}"/>`;
  for (let x = 0; x <= 1080; x += 135) wall += `<rect x="${x - 3}" y="0" width="6" height="900" fill="#F5E4B8"/>`;
  wall += `<rect x="0" y="560" width="1080" height="14" fill="#F5E4B8"/>`;
  wall += `<rect x="0" y="900" width="1080" height="180" fill="#E6CB93"/><rect x="0" y="896" width="1080" height="8" fill="${INK}"/>`;
  for (const x of [130, 520, 910])
    wall += `<rect x="${x}" y="770" width="40" height="130" fill="#8C88A3" stroke="${INK}" stroke-width="7"/><rect x="${x - 16}" y="884" width="72" height="18" rx="6" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>`;
  const machine = `
    <rect x="400" y="-20" width="34" height="160" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>
    <rect x="646" y="-20" width="34" height="160" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>
    <g id="stamper"></g>
    <rect x="300" y="118" width="480" height="264" rx="38" fill="${GOLD}" stroke="${INK}" stroke-width="8"/>
    <rect x="316" y="132" width="448" height="14" rx="7" fill="#fff" opacity=".35"/>
    <text x="540" y="180" text-anchor="middle" font-size="34" fill="${INK}" letter-spacing="2">VOTE-O-MATIC</text>
    <rect x="332" y="194" width="416" height="156" rx="20" fill="#FFFCEE" stroke="${INK}" stroke-width="7"/>
    <circle cx="322" cy="364" r="6" fill="${INK}"/><circle cx="758" cy="364" r="6" fill="${INK}"/>
    <circle id="bulbL" cx="346" cy="162" r="14" stroke="${INK}" stroke-width="6"/>
    <circle id="bulbR" cx="734" cy="162" r="14" stroke="${INK}" stroke-width="6"/>
    <g id="tally"></g>`;
  return `${wall}<g id="machine">${machine}</g><g id="belt"></g><g id="cards"></g>`;
}
function backHTML() {
  const name = WIN.name.toUpperCase().replace(/.$/, '') + '!';
  const tag = `${CHM.name.toUpperCase()} DISTRICT ${N} IS ${colName(WINP)}!`;
  const line = (str, y, size, fill, sw) =>
    `<text x="540" y="${y}" text-anchor="middle" font-size="${f1(size)}" fill="${fill}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke">${esc(str)}</text>`;
  return `
    <rect width="1080" height="1080" fill="${col(WINP)}"/>
    <g id="rays" transform="translate(540,560)">${rays(14, 900, colLight(WINP))}</g>
    <rect x="34" y="34" width="1012" height="1012" rx="40" fill="none" stroke="#fff" stroke-width="10" opacity=".55"/>
    <g id="words">
      ${line('CONGRATULATIONS,', 430, 92, '#fff', 16)}
      ${line(name, 620, fitSize(name, 158, 900), GOLD, 20)}
      ${line(tag, 752, fitSize(tag, 58, 880), '#fff', 12)}
    </g>`;
}

// ---------- per-frame drawing ----------
function cardSVG(n, x, t, lean) {
  let color = col(before(n)), sx = 1, sy = 1, lift = 0;
  let badge = null, bs = 1;
  const e = T[n];
  if (n < SEQ[0]) { color = col(after(n)); badge = color; }
  else if (e && t >= e.hit) { badge = col(after(n)); bs = easeOutBack(prog(t, e.hit, 0.22)); }
  if (e) {                                      // squash under the stamp
    const b = prog(t, e.hit, 0.32), bump = Math.sin(Math.PI * b) * (1 - b);
    sy *= 1 - 0.3 * bump; sx *= 1 + 0.16 * bump;
  }
  let j = null;
  if (n === N) {
    j = jump(t, F.crouch, F.leap, F.land, 320, 0.3);
    if (t >= F.alarm && t < F.crouch) lean = 3 * Math.sin((t - F.alarm) * 34);   // nervous wobble
  } else if (e && e.crouch !== undefined) {
    j = jump(t, e.crouch, e.leap, e.land, 210, 0.28);
    if (t >= e.hit + 0.12 && t < e.crouch) lean = 3 * Math.sin((t - e.hit) * 34);
  }
  if (j) { sx *= j.sx; sy *= j.sy; lift = j.lift; if (j.back) color = col(after(n)); }
  const sh = 1 - lift / 520, fs = n >= 100 ? 66 : 92;
  const svg = `<ellipse cx="${f1(x)}" cy="${BELT_Y + 4}" rx="${f1(84 * sh)}" ry="${f1(9 * sh)}" fill="#000" opacity="${f1(0.22 * sh)}"/>
    <g transform="translate(${f1(x)},${f1(BELT_Y - lift)}) rotate(${f1(lean)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})">
      <rect x="${-CW / 2}" y="${-CH}" width="${CW}" height="${CH}" rx="22" fill="${color}" stroke="${INK}" stroke-width="7"/>
      <rect x="${-CW / 2 + 16}" y="${-CH + 14}" width="${CW - 32}" height="10" rx="5" fill="#fff" opacity=".3"/>
      <text x="0" y="${n >= 100 ? -124 : -116}" text-anchor="middle" font-size="${fs}" fill="#fff" stroke="${INK}" stroke-width="9" stroke-linejoin="round" paint-order="stroke">${n}</text>
      ${badge ? `<g transform="translate(0,-60) scale(${bs.toFixed(3)})"><circle r="40" fill="#fff" stroke="${INK}" stroke-width="6"/>${check(13, badge)}</g>` : ''}
    </g>`;
  return { svg, lift };
}

function render(t) {
  t = clamp(t, 0, DURATION);
  const pos = beltPos(t), lean = beltLean(t);

  // belt
  let b = `<rect x="-40" y="${BELT_Y}" width="1160" height="56" rx="28" fill="#4B4563" stroke="${INK}" stroke-width="7"/>`;
  const travel = (pos - SEQ[0]) * SP;
  for (let x = -((travel % 54) + 54) % 54; x < 1100; x += 54)
    b += `<rect x="${f1(x)}" y="${BELT_Y + 5}" width="22" height="7" rx="3.5" fill="#6E6890"/>`;
  for (let x = 54; x < 1080; x += 108) {
    const a = -travel / 16;
    b += `<circle cx="${x}" cy="${BELT_Y + 31}" r="15" fill="#B9B5CC" stroke="${INK}" stroke-width="5"/>
      <line x1="${f1(x - 10 * Math.cos(a))}" y1="${f1(BELT_Y + 31 - 10 * Math.sin(a))}" x2="${f1(x + 10 * Math.cos(a))}" y2="${f1(BELT_Y + 31 + 10 * Math.sin(a))}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  }
  $('belt').innerHTML = b;

  // cards (anything in the air is drawn last so it passes in front)
  const cards = [];
  for (let n = Math.max(1, Math.floor(pos) - 3); n <= Math.min(CHM.total, Math.ceil(pos) + 3); n++) {
    const x = 540 + (n - pos) * SP;
    if (x > -120 && x < 1200) cards.push(cardSVG(n, x, t, lean));
  }
  cards.sort((p, q) => p.lift - q.lift);
  $('cards').innerHTML = cards.map(c => c.svg).join('');

  // machine: tally, bulbs, stamper
  let active = null;
  for (const s of SEQ) if (t >= T[s].tally) active = s;
  let tally = '', bulb = '#D8D0BC', ext = 0, shake = 0;
  if (active) {
    const e = T[active], w = after(active);
    const fade = e.move !== undefined ? 1 - prog(t, e.move, 0.3) : 1;
    const done = t >= e.tally + 13 * e.dt;
    if (fade > 0) {
      for (let k = 0; k < 13; k++) {
        const p = prog(t, e.tally + k * e.dt, 0.16);
        if (p <= 0) break;
        const isW = k % 2 === 0, who = isW ? w : (w === 'D' ? 'R' : 'D'), idx = Math.floor(k / 2);
        const x = 372 + idx * 56, y = who === 'R' ? 238 : 306;
        let sc = easeOutBack(p), op = fade;
        if (done) { if (isW) sc *= 1 + 0.1 * Math.sin((t - e.tally) * 14 + idx); else op *= 0.3; }
        tally += `<g transform="translate(${x},${y}) scale(${sc.toFixed(3)})" opacity="${f1(op)}">${check(10, col(who), 0.82)}</g>`;
      }
      if (done) bulb = col(w);
    }
    const sp = prog(t, e.stamp, 0.4);
    if (sp > 0 && sp < 1) ext = sp < 0.3 ? easeIn(sp / 0.3) : 1 - easeOut((sp - 0.3) / 0.7);
    // the machine objects when the stamp doesn't match the card
    const a0 = active === N ? F.alarm : (e.crouch !== undefined ? e.hit + 0.12 : null);
    const a1 = active === N ? F.leap : e.leap;
    if (a0 !== null && t >= a0 && t < a1) {
      shake = 7 * Math.sin((t - a0) * 46) * (1 - prog(t, a0, a1 - a0) * 0.5);
      bulb = Math.floor((t - a0) * 9) % 2 ? GOLD : '#fff';
    }
  }
  $('tally').innerHTML = tally;
  $('bulbL').setAttribute('fill', bulb); $('bulbR').setAttribute('fill', bulb);
  $('machine').setAttribute('transform', `translate(${f1(shake)},0)`);
  const hy = 404 + 56 * ext;
  $('stamper').innerHTML = `<rect x="524" y="360" width="32" height="${f1(hy - 350)}" fill="#B9B5CC" stroke="${INK}" stroke-width="7"/>
    <rect x="484" y="${f1(hy)}" width="112" height="30" rx="10" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>`;

  sceneFlip(t, Z);
  $('partyLayer').innerHTML = t < Math.min(F.land, ...P.pops.map(p => p[0])) ? '' : partySVG(t, P);
}

setupPage({
  video: `out/${KEY}-${N}.mp4`,
  caption: `Congratulations, ${WIN.name}! ${CHM.name} District ${N} is ${colName(WINP).toLowerCase()}.`,
  init() { buildStage(frontHTML(), backHTML()); return { render, duration: DURATION }; },
});
</script>
</body>
</html>
