<svg id="stage" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
// ---------- constants ----------
const SP = 216, CW = 170, CH = 230, BELT_Y = 720;
const RED = '#E23B3B', BLUE = '#2B6BE0', INK = '#2A2438', CREAM = '#FFF4D6', GOLD = '#FFC93C';
const LBLUE = '#8DB8FF';
const party = { 50: 'D', 51: 'R', 52: 'R', 53: 'R', 54: 'D', 55: 'R', 56: 'D', 57: 'D' };
const winner = { ...party, 55: 'D' };
const col = p => (p === 'D' ? BLUE : RED);

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, start, dur) => clamp((t - start) / dur);
const easeInOut = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeOutBack = p => { const c = 2.2; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const f1 = n => n.toFixed(1);

// ---------- timeline ----------
const SEQ = [52, 53, 54, 55];
const MOVE = 0.55;
const T = {};
{
  let t = 0.6;
  for (const s of SEQ) {
    const e = T[s] = {};
    e.dt = s === 55 ? 0.085 : 0.06;
    e.tally = t;
    t += 13 * e.dt + 0.2;
    e.stamp = t; e.hit = t + 0.12;
    t += 0.4;
    if (s !== 55) { t += 0.3; e.move = t; t += MOVE + 0.1; }
  }
}
const F = {};                       // the 55 card's flip
F.alarm = T[55].hit + 0.15;
F.crouch = T[55].hit + 0.85;
F.leap = F.crouch + 0.3;
F.land = F.leap + 0.8;
const Z = {};                       // the whole scene's flip
Z.zoom = F.land + 2.3;
Z.crouch = Z.zoom + 0.55;
Z.leap = Z.crouch + 0.35;
Z.land = Z.leap + 0.9;
const DURATION = Z.land + 6;

function beltPos(t) {
  let p = 52;
  for (const s of [52, 53, 54]) p += easeInOut(prog(t, T[s].move, MOVE));
  return p;
}
function beltLean(t) {
  for (const s of [52, 53, 54]) {
    const p = prog(t, T[s].move, MOVE);
    if (p > 0 && p < 1) return 4 * Math.sin(2 * Math.PI * p);
  }
  return 0;
}
// crouch -> leap -> flip -> land; returns scale, lift and whether the back is showing
function jump(t, crouchT, leapT, landT, height, squash) {
  let sx = 1, sy = 1, lift = 0, back = false;
  if (t < crouchT) return { sx, sy, lift, back };
  if (t < leapT) {
    const p = easeOut(prog(t, crouchT, leapT - crouchT));
    sy = 1 - squash * p; sx = 1 + squash * 0.6 * p;
  } else if (t < landT) {
    const q = (t - leapT) / (landT - leapT);
    lift = height * 4 * q * (1 - q);
    const c = Math.cos(3 * Math.PI * easeInOut(q));
    back = c < 0;
    const k = q < 0.15 ? q / 0.15 : 1;
    sy = q < 0.15 ? lerp(1 - squash, 1.14, k) : lerp(1.14, 1, (q - 0.15) / 0.85);
    const w = q < 0.15 ? lerp(1 + squash * 0.6, 0.93, k) : lerp(0.93, 1, (q - 0.15) / 0.85);
    sx = Math.max(Math.abs(c), 0.03) * w;
  } else {
    back = true;
    const r = prog(t, landT, 0.4);
    const b = Math.sin(Math.PI * r) * (1 - r);
    sy = 1 - squash * 1.6 * b; sx = 1 + squash * 1.0 * b;
  }
  return { sx, sy, lift, back };
}

// ---------- static scene ----------
const svg = document.getElementById('stage');
const check = (w, c, s = 1) =>
  `<path d="M${-18 * s},${2 * s} L${-5 * s},${15 * s} L${19 * s},${-13 * s}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

function rays(n, r, fill) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * 2 * Math.PI, a1 = a0 + Math.PI / n;
    d += `M0,0 L${f1(r * Math.cos(a0))},${f1(r * Math.sin(a0))} L${f1(r * Math.cos(a1))},${f1(r * Math.sin(a1))} Z `;
  }
  return `<path d="${d}" fill="${fill}"/>`;
}
const starR = rng(7);
let stars = '';
for (let i = 0; i < 46; i++)
  stars += `<circle cx="${f1(starR() * 1080)}" cy="${f1(starR() * 1080)}" r="${f1(1.5 + starR() * 3)}" fill="#fff" opacity="${f1(0.25 + starR() * 0.5)}"/>`;

let wall = `<rect width="1080" height="1080" fill="${CREAM}"/>`;
for (let x = 0; x <= 1080; x += 135) wall += `<rect x="${x - 3}" y="0" width="6" height="900" fill="#F5E4B8"/>`;
wall += `<rect x="0" y="560" width="1080" height="14" fill="#F5E4B8"/>`;
wall += `<rect x="0" y="900" width="1080" height="180" fill="#E6CB93"/><rect x="0" y="896" width="1080" height="8" fill="${INK}"/>`;
for (const x of [130, 520, 910])
  wall += `<rect x="${x}" y="770" width="40" height="130" fill="#8C88A3" stroke="${INK}" stroke-width="7"/><rect x="${x - 16}" y="884" width="72" height="18" rx="6" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>`;

const machineStatic = `
  <rect x="400" y="-20" width="34" height="160" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>
  <rect x="646" y="-20" width="34" height="160" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>
  <g id="stamper"></g>
  <rect x="300" y="118" width="480" height="264" rx="38" fill="${GOLD}" stroke="${INK}" stroke-width="8"/>
  <rect x="316" y="132" width="448" height="14" rx="7" fill="#fff" opacity=".35"/>
  <text x="540" y="180" text-anchor="middle" font-size="34" fill="${INK}" letter-spacing="2">VOTE-O-MATIC</text>
  <rect x="332" y="194" width="416" height="156" rx="20" fill="#FFFCEE" stroke="${INK}" stroke-width="7"/>
  <circle cx="322" cy="364" r="6" fill="${INK}"/><circle cx="758" cy="364" r="6" fill="${INK}"/>
  <circle id="bulbL" cx="346" cy="162" r="14" stroke="${INK}" stroke-width="6"/>
  <circle id="bulbR" cx="734" cy="162" r="14" stroke="${INK}" stroke-width="6"/>
  <g id="tally"></g>`;

const backFace = `
  <rect width="1080" height="1080" fill="${BLUE}"/>
  <g id="rays" transform="translate(540,560)">${rays(14, 900, '#3B7BF0')}</g>
  <rect x="34" y="34" width="1012" height="1012" rx="40" fill="none" stroke="#fff" stroke-width="10" opacity=".55"/>
  <g id="words">
    <text x="540" y="430" text-anchor="middle" font-size="92" fill="#fff" stroke="${INK}" stroke-width="16" stroke-linejoin="round" paint-order="stroke">CONGRATULATIONS,</text>
    <text x="540" y="620" text-anchor="middle" font-size="158" fill="${GOLD}" stroke="${INK}" stroke-width="20" stroke-linejoin="round" paint-order="stroke">ELLEN PAUL!</text>
    <text x="540" y="752" text-anchor="middle" font-size="58" fill="#fff" stroke="${INK}" stroke-width="12" stroke-linejoin="round" paint-order="stroke">THE 55TH IS BLUE!</text>
  </g>`;

svg.innerHTML = `
  <defs><clipPath id="clip"><rect id="clipRect" width="1080" height="1080"/></clipPath></defs>
  <rect width="1080" height="1080" fill="#1B1838"/>
  ${stars}
  <ellipse id="sceneShadow" cx="540" fill="#000" opacity="0"/>
  <g id="scene">
    <g clip-path="url(#clip)">
      <g id="front">${wall}<g id="machine">${machineStatic}</g><g id="belt"></g><g id="cards"></g></g>
      <g id="back" display="none">${backFace}</g>
    </g>
    <rect id="sceneBorder" width="1080" height="1080" fill="none" stroke="${INK}" stroke-width="12" opacity="0"/>
  </g>
  <g id="partyLayer"></g>`;
const $ = id => document.getElementById(id);

// ---------- celebration particles ----------
const PARTY_COLORS = [BLUE, LBLUE, GOLD, '#FFFFFF', '#3DD6C4', '#FFE48A'];
function makeBurst(seed, n, t0, cx, cy, vmin, vmax) {
  const r = rng(seed), out = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * (0.06 + 0.88 * r()), v = lerp(vmin, vmax, r());
    out.push({ t0, cx, cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 12 + r() * 12, h: 16 + r() * 16,
      spin: (r() - 0.5) * 900, flut: 6 + r() * 8, ph: r() * 6.28, color: PARTY_COLORS[Math.floor(r() * PARTY_COLORS.length)],
      round: r() < 0.22, life: 2.6 + r() * 0.8 });
  }
  return out;
}
const bursts = [
  ...makeBurst(11, 120, F.land, 540, 600, 450, 1500),
  ...makeBurst(23, 170, Z.land, 540, 620, 600, 1900),
];
const rain = (() => { const r = rng(5), out = [];
  for (let i = 0; i < 60; i++) out.push({ x: r() * 1080, off: r() * 1300, vy: 170 + r() * 160, w: 12 + r() * 10, h: 16 + r() * 14,
    spin: (r() - 0.5) * 500, flut: 4 + r() * 6, ph: r() * 6.28, sway: 20 + r() * 40, color: PARTY_COLORS[Math.floor(r() * PARTY_COLORS.length)] });
  return out; })();
const pops = [
  [F.land, 540, 600, 340, GOLD], [F.land + 0.35, 220, 300, 190, GOLD], [F.land + 0.6, 860, 250, 210, LBLUE],
  [F.land + 0.95, 250, 800, 170, '#3DD6C4'], [F.land + 1.25, 840, 790, 190, GOLD], [F.land + 1.6, 540, 190, 200, '#fff'],
  [F.land + 1.95, 150, 540, 160, LBLUE],
  [Z.land, 540, 560, 560, '#fff'], [Z.land + 0.3, 120, 150, 170, GOLD], [Z.land + 0.55, 960, 160, 170, GOLD],
  [Z.land + 0.9, 110, 930, 160, '#fff'], [Z.land + 1.2, 970, 940, 160, '#fff'],
  [Z.land + 1.8, 540, 110, 150, GOLD], [Z.land + 2.4, 70, 250, 120, '#fff'], [Z.land + 2.7, 1010, 810, 120, '#fff'],
  [Z.land + 3.4, 200, 170, 150, GOLD], [Z.land + 4.0, 880, 900, 150, GOLD], [Z.land + 4.6, 870, 170, 140, '#fff'],
  [Z.land + 5.1, 210, 900, 140, '#fff'],
];
const balloons = (() => { const r = rng(42), out = [];
  const cols = [BLUE, GOLD, LBLUE, '#FFFFFF', BLUE, GOLD];
  // first wave: fast enough to be clear of the message by the time the scene card lands
  for (let i = 0; i < 10; i++) out.push({ t0: F.land + 0.2 + r() * 1.0, x: r() < 0.5 ? 70 + r() * 290 : 720 + r() * 290,
    v: 390 + r() * 120, sway: 14 + r() * 20, ph: r() * 6.28, s: 0.85 + r() * 0.35, color: cols[i % cols.length] });
  // second wave: hugs the outer edges so it never crosses the text
  for (let i = 0; i < 10; i++) out.push({ t0: Z.land + 0.1 + r() * 4.0, x: i % 2 ? 15 + r() * 60 : 1005 + r() * 60,
    v: 260 + r() * 120, sway: 8 + r() * 6, ph: r() * 6.28, s: 0.8 + r() * 0.3, color: cols[(i + 2) % cols.length] });
  return out; })();

function partySVG(t) {
  if (t < F.land) return '';
  let s = '';
  for (const [t0, x, y, R, c] of pops) {
    const p = prog(t, t0, 0.75);
    if (p <= 0 || p >= 1) continue;
    const e = easeOut(p), r1 = R * e * 0.55, r2 = R * e, w = 12 * (1 - p) + 2, n = R > 300 ? 18 : 12;
    let d = '';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 2 * Math.PI + x;
      d += `M${f1(x + r1 * Math.cos(a))},${f1(y + r1 * Math.sin(a))} L${f1(x + r2 * Math.cos(a))},${f1(y + r2 * Math.sin(a))} `;
    }
    s += `<path d="${d}" stroke="${INK}" stroke-width="${f1(w + 7)}" stroke-linecap="round" opacity="${f1(1 - p * p)}" fill="none"/>`;
    s += `<path d="${d}" stroke="${c}" stroke-width="${f1(w)}" stroke-linecap="round" opacity="${f1(1 - p * p)}" fill="none"/>`;
  }
  for (const b of balloons) {
    const tau = t - b.t0; if (tau < 0) continue;
    const y = 1180 - b.v * tau; if (y < -260) continue;
    const x = b.x + b.sway * Math.sin(tau * 2.2 + b.ph), tilt = 6 * Math.cos(tau * 2.2 + b.ph);
    s += `<g transform="translate(${f1(x)},${f1(y)}) rotate(${f1(tilt)}) scale(${b.s})">
      <path d="M0,66 q12,28 0,56 q-12,28 0,56" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
      <path d="M-9,66 L9,66 L0,52 Z" fill="${b.color}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <ellipse rx="48" ry="58" fill="${b.color}" stroke="${INK}" stroke-width="6"/>
      <ellipse cx="-17" cy="-22" rx="10" ry="16" fill="#fff" opacity=".55" transform="rotate(24 -17 -22)"/></g>`;
  }
  for (const c of bursts) {
    const tau = t - c.t0; if (tau < 0 || tau > c.life) continue;
    const k = 1.5, d = (1 - Math.exp(-k * tau)) / k;
    const x = c.cx + c.vx * d, y = c.cy + c.vy * d + 330 * tau * tau;
    if (y > 1140) continue;
    const o = clamp((c.life - tau) / 0.5), fl = Math.cos(tau * c.flut + c.ph);
    s += c.round
      ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(c.w * 0.5)}" fill="${c.color}" stroke="${INK}" stroke-width="3" opacity="${f1(o)}"/>`
      : `<rect x="${f1(-c.w / 2)}" y="${f1(-c.h / 2)}" width="${f1(c.w)}" height="${f1(c.h)}" rx="3" fill="${c.color}" stroke="${INK}" stroke-width="3" opacity="${f1(o)}" transform="translate(${f1(x)},${f1(y)}) rotate(${f1(c.spin * tau)}) scale(1,${f1(fl)})"/>`;
  }
  if (t > Z.land + 0.6) {
    const tau = t - Z.land - 0.6, o = clamp(tau / 0.6);
    for (const c of rain) {
      const y = ((c.off + c.vy * tau) % 1300) - 110;
      if (c.vy * tau + c.off < 1300 && y > c.vy * tau - 110) continue;   // not yet entered from the top
      const x = c.x + c.sway * Math.sin(tau * 1.6 + c.ph), fl = Math.cos(tau * c.flut + c.ph);
      s += `<rect x="${f1(-c.w / 2)}" y="${f1(-c.h / 2)}" width="${f1(c.w)}" height="${f1(c.h)}" rx="3" fill="${c.color}" stroke="${INK}" stroke-width="3" opacity="${f1(o)}" transform="translate(${f1(x)},${f1(y)}) rotate(${f1(c.spin * tau)}) scale(1,${f1(fl)})"/>`;
    }
  }
  return s;
}

// ---------- per-frame drawing ----------
function cardSVG(n, x, t, lean) {
  let color = col(party[n]), sx = 1, sy = 1, lift = 0;
  let badge = null, bs = 1;
  if (n < 52) badge = col(party[n]);
  else if (T[n] && t >= T[n].hit) { badge = col(winner[n]); bs = easeOutBack(prog(t, T[n].hit, 0.22)); }
  if (T[n]) {                                   // squash under the stamp
    const b = prog(t, T[n].hit, 0.32), bump = Math.sin(Math.PI * b) * (1 - b);
    sy *= 1 - 0.3 * bump; sx *= 1 + 0.16 * bump;
  }
  if (n === 55) {
    const j = jump(t, F.crouch, F.leap, F.land, 320, 0.3);
    sx *= j.sx; sy *= j.sy; lift = j.lift;
    if (j.back) color = BLUE;
    if (t >= F.alarm && t < F.crouch) lean = 3 * Math.sin((t - F.alarm) * 34);   // nervous wobble
  }
  const sh = 1 - lift / 520;
  return `<ellipse cx="${f1(x)}" cy="${BELT_Y + 4}" rx="${f1(84 * sh)}" ry="${f1(9 * sh)}" fill="#000" opacity="${f1(0.22 * sh)}"/>
    <g transform="translate(${f1(x)},${f1(BELT_Y - lift)}) rotate(${f1(lean)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})">
      <rect x="${-CW / 2}" y="${-CH}" width="${CW}" height="${CH}" rx="22" fill="${color}" stroke="${INK}" stroke-width="7"/>
      <rect x="${-CW / 2 + 16}" y="${-CH + 14}" width="${CW - 32}" height="10" rx="5" fill="#fff" opacity=".3"/>
      <text x="0" y="-116" text-anchor="middle" font-size="92" fill="#fff" stroke="${INK}" stroke-width="9" stroke-linejoin="round" paint-order="stroke">${n}</text>
      ${badge ? `<g transform="translate(0,-60) scale(${bs.toFixed(3)})"><circle r="40" fill="#fff" stroke="${INK}" stroke-width="6"/>${check(13, badge)}</g>` : ''}
    </g>`;
}

function render(t) {
  t = clamp(t, 0, DURATION);
  const pos = beltPos(t), lean = beltLean(t);

  // belt
  let b = `<rect x="-40" y="${BELT_Y}" width="1160" height="56" rx="28" fill="#4B4563" stroke="${INK}" stroke-width="7"/>`;
  const travel = (pos - 52) * SP;
  for (let x = -((travel % 54) + 54) % 54; x < 1100; x += 54)
    b += `<rect x="${f1(x)}" y="${BELT_Y + 5}" width="22" height="7" rx="3.5" fill="#6E6890"/>`;
  for (let x = 54; x < 1080; x += 108) {
    const a = -travel / 16;
    b += `<circle cx="${x}" cy="${BELT_Y + 31}" r="15" fill="#B9B5CC" stroke="${INK}" stroke-width="5"/>
      <line x1="${f1(x - 10 * Math.cos(a))}" y1="${f1(BELT_Y + 31 - 10 * Math.sin(a))}" x2="${f1(x + 10 * Math.cos(a))}" y2="${f1(BELT_Y + 31 + 10 * Math.sin(a))}" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  }
  $('belt').innerHTML = b;

  // cards (the leaping 55 is drawn last so it passes in front)
  let c = '';
  for (let n = 50; n <= 57; n++) {
    if (n === 55) continue;
    const x = 540 + (n - pos) * SP;
    if (x > -120 && x < 1200) c += cardSVG(n, x, t, lean);
  }
  const x55 = 540 + (55 - pos) * SP;
  if (x55 < 1200) c += cardSVG(55, x55, t, lean);
  $('cards').innerHTML = c;

  // machine: tally, bulbs, stamper
  let active = null;
  for (const s of SEQ) if (t >= T[s].tally) active = s;
  let tally = '', bulb = '#D8D0BC', ext = 0;
  if (active) {
    const e = T[active], w = winner[active];
    const fade = e.move !== undefined ? 1 - prog(t, e.move, 0.3) : 1;
    const done = t >= e.tally + 13 * e.dt;
    if (fade > 0) {
      for (let k = 0; k < 13; k++) {
        const p = prog(t, e.tally + k * e.dt, 0.16);
        if (p <= 0) break;
        const isW = k % 2 === 0, who = isW ? w : (w === 'D' ? 'R' : 'D'), idx = Math.floor(k / 2);
        const x = 372 + idx * 56, y = who === 'R' ? 238 : 306;
        let sc = easeOutBack(p), op = fade;
        if (done) { if (isW) sc *= 1 + 0.1 * Math.sin((t - e.tally) * 14 + idx); else op *= 0.3; }
        tally += `<g transform="translate(${x},${y}) scale(${sc.toFixed(3)})" opacity="${f1(op)}">${check(10, col(who), 0.82)}</g>`;
      }
      if (done) bulb = col(w);
    }
    const sp = prog(t, e.stamp, 0.4);
    if (sp > 0 && sp < 1) ext = sp < 0.3 ? easeIn(sp / 0.3) : 1 - easeOut((sp - 0.3) / 0.7);
  }
  let shake = 0;
  if (t >= F.alarm && t < F.leap) {
    shake = 7 * Math.sin((t - F.alarm) * 46) * (1 - prog(t, F.alarm, F.leap - F.alarm) * 0.5);
    bulb = Math.floor((t - F.alarm) * 9) % 2 ? GOLD : '#fff';
  }
  $('tally').innerHTML = tally;
  $('bulbL').setAttribute('fill', bulb); $('bulbR').setAttribute('fill', bulb);
  $('machine').setAttribute('transform', `translate(${f1(shake)},0)`);
  const hy = 404 + 56 * ext;
  $('stamper').innerHTML = `<rect x="524" y="360" width="32" height="${f1(hy - 350)}" fill="#B9B5CC" stroke="${INK}" stroke-width="7"/>
    <rect x="484" y="${f1(hy)}" width="112" height="30" rx="10" fill="#8C88A3" stroke="${INK}" stroke-width="7"/>`;

  // the whole scene as a card: pull back, crouch, leap, flip to the message
  const zp = easeInOut(prog(t, Z.zoom, 0.5));
  let s = lerp(1, 0.78, zp);
  if (t >= Z.land) s = lerp(0.78, 0.9, easeOutBack(prog(t, Z.land + 0.25, 0.5)));
  const j = jump(t, Z.crouch, Z.leap, Z.land, 150, 0.2);
  const bottom = 540 + 540 * s;
  $('scene').setAttribute('transform',
    `translate(540,${f1(bottom - j.lift)}) scale(${(s * j.sx).toFixed(4)},${(s * j.sy).toFixed(4)}) translate(-540,-1080)`);
  const rx = f1(48 * zp);
  $('clipRect').setAttribute('rx', rx);
  $('sceneBorder').setAttribute('rx', rx); $('sceneBorder').setAttribute('opacity', f1(zp));
  $('front').setAttribute('display', j.back ? 'none' : 'inline');
  $('back').setAttribute('display', j.back ? 'inline' : 'none');
  const shs = 1 - j.lift / 400;
  $('sceneShadow').setAttribute('cy', f1(bottom + 14)); $('sceneShadow').setAttribute('rx', f1(430 * s * shs));
  $('sceneShadow').setAttribute('ry', f1(16 * shs)); $('sceneShadow').setAttribute('opacity', f1(0.45 * zp));
  if (j.back) {
    $('rays').setAttribute('transform', `translate(540,560) rotate(${f1(t * 9)})`);
    const pulse = 1 + 0.025 * Math.sin((t - Z.land) * 5);
    $('words').setAttribute('transform', `translate(540,560) scale(${pulse.toFixed(4)}) translate(-540,-560)`);
  }

  $('partyLayer').innerHTML = partySVG(t);
}

// ---------- playback ----------
window.renderAt = render;
window.DURATION = DURATION;
const exporting = new URLSearchParams(location.search).has('export');
const scrub = $('scrub');
let startAt = null, playing = false;
function tick(now) {
  if (!playing) return;
  if (startAt === null) startAt = now;
  const t = (now - startAt) / 1000;
  render(t);
  scrub.value = Math.round(1000 * clamp(t / DURATION));
  if (t < DURATION) requestAnimationFrame(tick); else playing = false;
}
function play() { startAt = null; playing = true; requestAnimationFrame(tick); }
$('replay').onclick = play;
scrub.oninput = () => { playing = false; render((scrub.value / 1000) * DURATION); };
// Phones (and some desktops) can hand the MP4 itself to the system share sheet, where Facebook is one choice.
const PAGE_URL = 'https://docs.andoverctdems.com/flip-55/';
const fileShare = $('fileShare');
try {
  const probe = new File([''], 'flip-55.mp4', { type: 'video/mp4' });
  if (navigator.canShare && navigator.canShare({ files: [probe] })) fileShare.hidden = false;
} catch (e) { /* no file sharing here; the link-share button still works */ }
fileShare.onclick = async () => {
  try {
    const blob = await (await fetch('flip-55.mp4')).blob();
    const file = new File([blob], 'flip-55.mp4', { type: 'video/mp4' });
    await navigator.share({ files: [file], title: 'Flipping the 55th', text: 'Congratulations, Ellen Paul! ' + PAGE_URL });
  } catch (e) {
    if (e.name !== 'AbortError') window.open($('fbShare').href, '_blank', 'noopener');
  }
};

render(0);
if (exporting) document.body.classList.add('export');
else (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
</script>
