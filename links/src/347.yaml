title: "Society of Environmental Journalists: Democrats plan investigation into climate and science cuts"
description: >-
  A summary of a November 12, 2026 New York Times report on letters from two
  House committees telling companies and officials to preserve documents ahead
  of an investigation into cuts to climate and weather research.
